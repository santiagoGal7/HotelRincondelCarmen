<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hotel El Rincón del Carmen, en Carmen de Apicalá, Tolima. Tres habitaciones, desayuno, piscina y spa con cita."
    />
    <meta name="theme-color" content="#0c0b0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="/media/hero-poster-800.avif"
      type="image/avif"
      fetchpriority="high"
    />
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: #0c0b0a;
      }
      #boot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <title>Hotel El Rincón del Carmen</title>
    <script>
      try {
        var stored = localStorage.getItem('rdc.theme')
        if (stored !== 'light') document.documentElement.classList.add('dark')
      } catch (error) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="boot">
      <img
        src="/media/hero-poster-800.avif"
        alt=""
        width="800"
        height="450"
        fetchpriority="high"
        decoding="async"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
